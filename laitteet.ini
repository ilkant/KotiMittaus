# Terveysmittalaitteiden asetukset
# Muokkaa tähän omat tietosi

[laitteet]
contour = 00:00:00:00:00:00
omron   = 00:00:00:00:00:00
beurer  = 00:00:00:00:00E:00

[asetukset]
# Tallennushakemisto (oletus: ohjelman hakemisto)
hakemisto = /home/user/Documents/Health

# Tiedostonimen muoto — voit käyttää päivämäärämuuttujia:
#   {vuosi}    = 2026
#   {kuukausi} = 05
#   {paiva}    = 25
# Esimerkkejä:
#   terveysmittaukset.xlsx          (yksi tiedosto aina)
#   terveys_{vuosi}-{kuukausi}.xlsx (kuukausittainen tiedosto)
#   terveys_{vuosi}.xlsx            (vuosittainen tiedosto)
tiedosto = terveys_{vuosi}.xlsx
