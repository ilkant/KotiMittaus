# Health measuring devices settings. You can edit these.
# Terveysmittalaitteiden asetukset. Muokkaa tähän omat tietosi

[devices]
contour = 00:00:00:00:00:00
omron   = 00:00:00:00:00:00
beurer  = 00:00:00:00:00:00

[settings]
# Default output directory is health.py directory
# You can use year, month or day definition in file name
# Tallennushakemisto (oletus: ohjelman hakemisto)
# Tiedostonimen muoto — voit käyttää päivämäärämuuttujia:

#   {year}  = 2026
#   {month} = 05
#   {day}   = 25

# Examples:
#   health.xlsx                   (yksi tiedosto aina)
#   health_2026-5.xlsx            (kuukausittainen tiedosto)
#   health_26-5.xlsx              (vuosittainen tiedosto)

directory = /home/user/Documents/Health/Measurements
filename = health_{year}.xlsx

# Pollauksen asetukset:
#   polling_interval = pollauskierrosten väli sekunteina (oletus: 60)
#   polling_time     = pollauksen enimmäiskesto minuutteina (oletus: 30)
#   quit_shortcut    = näppäin, jolla pollauksen voi keskeyttää (oletus: q)
polling_interval = 60
polling_time = 20
quit_shortcut = q

# Lokitus tiedostoon kotimittaus.log (ohjelman hakemistossa):
#   log_level = 0  ei kirjoiteta mitään
#   log_level = 1  tiedot saatu laitteelta + lukemien lukumäärä
#   log_level = 2  yksityiskohtaisempaa tietoa ohjelman suorituksesta
#   log_level = 4  kaikki näytölle tulostettava teksti lokiin
# Ylempi taso sisältää aina alempien tasojen tapahtumat (3 toimii kuten 2).
log_level = 2
